spring.datasource.url=jdbc:sqlserver://${MEDCARE_DB_HOST}:1433;databaseName=${MEDCARE_DB_NAME};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30

spring.datasource.username=${MEDCARE_DB_USERNAME}
spring.datasource.password=${MEDCARE_DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true